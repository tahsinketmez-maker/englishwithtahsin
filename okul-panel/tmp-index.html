<!DOCTYPE html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Okul Paneli</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#1c2230;--muted:#6b7385;--line:#e2e5ec;--accent:#2f6fdf;--soft:#e8f0fd;--danger:#d64545;--ok:#2e9d5b;--radius:12px}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--card:#1c2028;--text:#e6e9ef;--muted:#9099ab;--line:#2c313c;--accent:#6b9bf2;--soft:#223150}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px 4px;max-width:1100px;margin:0 auto}
.top h1{font-size:18px;margin:0;font-weight:700}
#status{margin-left:auto;font-size:13px;color:var(--muted)}
#status.err{color:var(--danger)}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;max-width:1100px;margin:0 auto}
nav button{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.defter{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.grid2,.defter{grid-template-columns:1fr}}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--accent)}
textarea{width:100%;resize:vertical;line-height:1.5}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li.now{background:var(--soft);border-radius:8px}
.list input[type=checkbox]{width:18px;height:18px;flex:none;cursor:pointer}
.title{font-weight:550;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;margin-top:3px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--accent)}
.tag.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.t-sinav{background:#fde8e8;color:#b83232}
.tag.t-odev{background:#e6f4ec;color:#23794a}
.tag.t-proje{background:#f1e8fb;color:#7341b0}
@media (prefers-color-scheme:dark){.tag.t-sinav{background:#4a2222;color:#f2a3a3}.tag.t-odev{background:#1e3d2b;color:#8fd4ac}.tag.t-proje{background:#352450;color:#c9a8f0}}
.done .title{text-decoration:line-through;color:var(--muted)}
.late{color:var(--danger);font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:92px;flex:none}
.pill{padding:3px 10px;border-radius:8px;font-weight:550}
.empty{color:var(--muted);padding:8px 0}
.scroll{overflow-x:auto}
table.prog{width:100%;border-collapse:collapse;min-width:620px}
.prog th,.prog td{border:1px solid var(--line);padding:0;font-size:14px}
.prog th{padding:8px;background:var(--bg);font-weight:600}
.prog th.today{color:var(--accent)}
.prog td.today{box-shadow:inset 0 0 0 1px var(--accent)}
.prog td input{width:100%;border:0;border-radius:0;background:transparent;padding:11px 6px;text-align:center}
.prog .tcol{width:110px}
.prog .tcol input{font-size:13px;color:var(--muted)}
.nitem{cursor:pointer}
.nitem.sel{background:var(--soft);border-radius:8px}
.hidden{display:none}
.big-date{font-size:22px;font-weight:700;margin:2px 0 14px}
#loader{padding:60px 16px;text-align:center;color:var(--muted)}
a{color:var(--accent)}
.fname{color:var(--text);text-decoration:none;font-weight:550;overflow-wrap:anywhere}
.fname:hover{color:var(--accent)}
.fname{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-align:left}
#giris{max-width:380px;margin:40px auto;text-align:center}
#giris img{width:88px;height:88px;border-radius:20px;margin-bottom:12px}
#giris h2{font-size:20px;margin:0 0 4px}
#giris form{display:flex;flex-direction:column;gap:10px;margin-top:18px;text-align:left}
#giris input[type=password]{font-size:17px;padding:12px}
#giris .hata{color:var(--danger);min-height:20px;font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.logged-out nav,.logged-out #status,.logged-out .user{visibility:hidden}
.user{position:relative}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;border:0;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--accent)}
.avatar.big{width:64px;height:64px;font-size:24px;cursor:default}
.menu{position:absolute;right:0;top:44px;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;z-index:20}
.menu-head{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-head b{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--text);padding:10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu button.danger{color:var(--danger)}
.profil-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>📚 Okul Paneli</h1><span id="status">Yükleniyor…</span>
    <div class="user">
      <button id="user-btn" class="avatar" aria-label="Kullanıcı menüsü" title="Kullanıcı">?</button>
      <div id="user-menu" class="menu hidden">
        <div class="menu-head"><span id="um-avatar" class="avatar" style="cursor:default">?</span><div><b id="um-ad">Kullanıcı</b><span id="um-alt" class="muted" style="font-size:13px"></span></div></div>
        <button data-act="profil">👤 Profil</button>
        <button data-act="cikis" class="danger">↪ Çıkış yap</button>
      </div>
    </div>
  </div>
  <nav>
    <button data-tab="bugun" class="active">Bugün</button>
    <button data-tab="program">Ders Programı</button>
    <button data-tab="ajanda">Ajanda</button>
    <button data-tab="defter">Defter</button>
    <button data-tab="dosyalar">Dosyalar</button>
  </nav>
</header>
<main>
  <div id="loader">Yükleniyor…</div>
  <section id="giris" class="hidden">
    <div class="card">
      <img src="https://raw.githubusercontent.com/tahsinketmez-maker/englishwithtahsin/okul-panel-logo/okul-panel/okul-panel-icon-192.png" alt="">
      <h2>Okul Paneli</h2>
      <div class="muted">Devam etmek için şifreni gir.</div>
      <form id="giris-form">
        <input type="password" name="sifre" placeholder="Şifre" autocomplete="current-password" required>
        <label class="check"><input type="checkbox" name="hatirla"><span>Bu cihazda beni hatırla (okul bilgisayarında işaretleme)</span></label>
        <button class="btn primary">Giriş</button>
        <div class="hata" id="giris-hata"></div>
      </form>
    </div>
  </section>
  <section id="profil" class="hidden">
    <div class="card">
      <div class="profil-head"><span id="pr-avatar" class="avatar big">?</span><div><div id="pr-ad" style="font-size:18px;font-weight:700">Profil</div><div id="pr-alt" class="muted"></div></div></div>
      <form id="profil-form">
        <div class="form-grid">
          <label>Ad Soyad<input name="ad" placeholder="Ör. Tahsin Kötülüketmez"></label>
          <label>Görev / Sınıf<input name="unvan" placeholder="Ör. İngilizce Öğretmeni ya da 11-A"></label>
          <label>Okul<input name="okul" placeholder="Okulunun adı"></label>
          <label>E-posta (isteğe bağlı)<input name="eposta" type="email" placeholder="ornek@gmail.com"></label>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn primary">Kaydet</button><span id="profil-durum" class="muted" style="font-size:13px"></span></div>
      </form>
    </div>
    <div class="card"><h2>Şifreyi değiştir</h2>
      <form id="sifre-form" class="row">
        <input type="password" name="eski" placeholder="Mevcut şifre" required autocomplete="current-password" style="flex:1;min-width:160px">
        <input type="password" name="yeni" placeholder="Yeni şifre (en az 8 karakter)" required autocomplete="new-password" style="flex:1;min-width:160px">
        <input type="password" name="yeni2" placeholder="Yeni şifre tekrar" required autocomplete="new-password" style="flex:1;min-width:160px">
        <button class="btn primary">Değiştir</button>
      </form>
      <div id="sifre-durum" class="muted" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div class="card"><h2>Oturum</h2>
      <p class="muted" style="margin-top:0">Ortak bir bilgisayardaysan işin bitince çıkış yap.</p>
      <button class="btn danger" data-act="cikis">Çıkış yap</button>
    </div>
  </section>
  <section id="bugun" class="hidden"></section>
  <section id="program" class="hidden"></section>
  <section id="ajanda" class="hidden"></section>
  <section id="defter" class="hidden"></section>
  <section id="dosyalar" class="hidden"></section>
</main>
<datalist id="etiketler"></datalist>

<script>
/* ================= Yardımcılar ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TURLER = {odev:'Ödev', sinav:'Sınav', proje:'Proje', toplanti:'Toplantı', etkinlik:'Etkinlik', diger:'Diğer'};
const lower = s => String(s || '').toLocaleLowerCase('tr');

function gunFarki(s){
  const [y,m,d] = s.split('-').map(Number);
  const t = new Date(y, m-1, d), n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t - n) / 86400000);
}
function kalanYazi(f){
  if (f === 0) return 'bugün';
  if (f === 1) return 'yarın';
  if (f < 0) return (-f) + ' gün geçti';
  return f + ' gün kaldı';
}
function tarihYazi(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('tr-TR', {day:'numeric', month:'short', weekday:'short'});
}
const tarihSirala = (a,b) => (a.tarih || '9999').localeCompare(b.tarih || '9999');
function renkStil(t){
  let h = 0; for (const c of lower(t).trim()) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `background:hsla(${h},70%,50%,.17)`;
}
function aralik(s){
  const m = String(s).match(/(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})/);
  return m ? [m[1]*60 + +m[2], m[3]*60 + +m[4]] : null;
}
function boyut(b){
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(0) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function ikon(m){
  m = m || '';
  if (m.includes('pdf')) return '📕';
  if (m.includes('presentation') || m.includes('powerpoint')) return '📊';
  if (m.includes('sheet') || m.includes('excel')) return '📗';
  if (m.includes('word') || m.includes('document')) return '📘';
  if (m.startsWith('image')) return '🖼️';
  if (m.startsWith('video')) return '🎬';
  if (m.startsWith('audio')) return '🎧';
  return '📄';
}

/* ================= Sunucu bağlantısı ================= */
const YEREL = typeof google === 'undefined' || !google.script; // bilgisayarda önizleme modu
let SIFRE = null;
const depo = {
  al(){ try { return localStorage.getItem('op_sifre') || sessionStorage.getItem('op_sifre'); } catch (e) { return null; } },
  koy(s, kalici){ try { (kalici ? localStorage : sessionStorage).setItem('op_sifre', s); } catch (e) {} },
  sil(){ try { localStorage.removeItem('op_sifre'); sessionStorage.removeItem('op_sifre'); } catch (e) {} }
};
function call(fn, ...args){
  const p = YEREL ? yerelSunucu(fn, [SIFRE, ...args])
    : new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](SIFRE, ...args));
  return p.catch(e => {
    const m = String(e && e.message || e);
    if (/Şifre yanlış|Çok fazla hatalı/.test(m) && fn !== 'girisKontrol' && fn !== 'sifreDegistir') girisGoster(m);
    throw e;
  });
}
function yerelSunucu(fn, args){ // yalnızca önizleme için (şifre: test1234)
  const st = window.__yerel || (window.__yerel = {data:'{}', files:[], pass:'test1234'});
  return new Promise((r, j) => setTimeout(() => {
    if (args[0] !== st.pass) return j(new Error('Şifre yanlış.'));
    if (fn === 'girisKontrol') r(true);
    else if (fn === 'sifreDegistir') { if (String(args[1]).length < 8) return j(new Error('Yeni şifre en az 8 karakter olmalı.')); st.pass = args[1]; r(true); }
    else if (fn === 'loadData') r(st.data);
    else if (fn === 'saveData') { st.data = args[1]; r(new Date().toISOString()); }
    else if (fn === 'listFiles') r(st.files);
    else if (fn === 'uploadFile') { st.files.unshift({id:uid(), name:args[1], mime:args[2], b64:args[3], size:Math.round(args[3].length*.75), date:new Date().toISOString(), etiket:args[4]||''}); r(st.files); }
    else if (fn === 'getFile') { const f = st.files.find(x => x.id === args[1]); r({name:f.name, mime:f.mime, b64:f.b64}); }
    else if (fn === 'deleteFile') { st.files = st.files.filter(f => f.id !== args[1]); r(st.files); }
  }, 150));
}

/* ================= Giriş ================= */
function girisGoster(mesaj){
  SIFRE = null; depo.sil(); D = null; dirty = false; clearTimeout(saveTimer); menuKapat();
  dosyalar = null; dosyaSekmesiHazir = false; notSecili = null;
  document.body.classList.add('logged-out');
  document.querySelectorAll('main > section, #loader').forEach(s => s.classList.add('hidden'));
  $('#giris').classList.remove('hidden');
  $('#giris-hata').textContent = mesaj && !/Şifre yanlış/.test(mesaj) ? mesaj : (mesaj ? 'Şifre yanlış.' : '');
  const i = $('#giris-form [name=sifre]'); i.value = ''; i.focus();
}
async function girisYap(sifre, kalici){
  SIFRE = sifre;
  await call('girisKontrol');
  depo.koy(sifre, kalici);
  document.body.classList.remove('logged-out');
  $('#giris').classList.add('hidden');
  $('#loader').classList.remove('hidden');
  $('#loader').textContent = "Veriler Google Drive'dan alınıyor…";
  await yukle();
}
async function basla(){
  const s = depo.al();
  if (!s) return girisGoster();
  try { await girisYap(s, (() => { try { return !!localStorage.getItem('op_sifre'); } catch (e) { return false; } })()); }
  catch (e) { girisGoster(String(e && e.message || e)); }
}

/* ================= Veri & kaydetme ================= */
let D = null, dirty = false, saving = false, saveTimer = null;

function varsayilan(){
  return {v:1,
    saatler:['08:30-09:10','09:20-10:00','10:10-10:50','11:00-11:40','11:50-12:30','13:20-14:00','14:10-14:50','15:00-15:40'],
    program:{1:[],2:[],3:[],4:[],5:[]}, ajanda:[], defter:[], profil:{ad:'', unvan:'', okul:'', eposta:''}};
}
function normalize(d){
  const x = Object.assign(varsayilan(), d || {});
  for (let g = 1; g <= 5; g++) if (!Array.isArray(x.program[g])) x.program[g] = [];
  if (!Array.isArray(x.ajanda)) x.ajanda = [];
  if (!Array.isArray(x.defter)) x.defter = [];
  x.profil = Object.assign({ad:'', unvan:'', okul:'', eposta:''}, x.profil || {});
  return x;
}

/* ================= Kullanıcı / Profil ================= */
function basHarf(ad){
  const p = String(ad || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toLocaleUpperCase('tr');
}
function avatarRenk(ad){
  let h = 210; for (const c of String(ad || '')) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h},55%,45%)`;
}
function renderKullanici(){
  const p = D.profil, ad = p.ad.trim();
  const alt = [p.unvan, p.okul].filter(Boolean).join(' · ');
  ['#user-btn', '#um-avatar', '#pr-avatar'].forEach(s => { const e = $(s); e.textContent = basHarf(ad); e.style.background = avatarRenk(ad); });
  $('#user-btn').title = ad || 'Kullanıcı';
  $('#um-ad').textContent = ad || 'Adını ekle';
  $('#um-alt').textContent = alt;
  $('#pr-ad').textContent = ad || 'Profil';
  $('#pr-alt').textContent = alt || 'Bilgilerini doldur, sağ üstte görünsün.';
}
function renderProfil(){
  const f = $('#profil-form');
  ['ad', 'unvan', 'okul', 'eposta'].forEach(k => f[k].value = D.profil[k] || '');
  $('#profil-durum').textContent = '';
  renderKullanici();
}
function menuKapat(){ $('#user-menu').classList.add('hidden'); }
function setStatus(t, err){ const s = $('#status'); s.textContent = t; s.className = err ? 'err' : ''; }

function change(){
  dirty = true; setStatus('Kaydediliyor…');
  clearTimeout(saveTimer); saveTimer = setTimeout(kaydet, 800);
}
async function kaydet(){
  if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(kaydet, 500); return; }
  saving = true; dirty = false;
  try {
    await call('saveData', JSON.stringify(D));
    if (!dirty) setStatus('Kaydedildi ✓');
  } catch (e) {
    dirty = true; setStatus('Kaydedilemedi, tekrar deneniyor…', true);
    clearTimeout(saveTimer); saveTimer = setTimeout(kaydet, 5000);
  } finally { saving = false; }
}
async function yukle(sessiz){
  try {
    const t = await call('loadData');
    if (sessiz && (dirty || saving)) return;
    D = normalize(JSON.parse(t || '{}'));
    $('#loader').classList.add('hidden');
    render(); sekme(aktifSekme, true);
    setStatus(sessiz ? 'Güncellendi ✓' : 'Hazır');
  } catch (e) {
    setStatus('Yüklenemedi', true);
    if (!sessiz) $('#loader').textContent = 'Veriler yüklenemedi: ' + (e.message || e) + ' — sayfayı yenile.';
  }
}
window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
let gizlendi = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { gizlendi = Date.now(); return; }
  if (D && !dirty && !saving && Date.now() - gizlendi > 30000) yukle(true); // başka bilgisayarda yapılan değişiklikleri al
});

/* ================= Sekmeler ================= */
let aktifSekme = 'bugun', dosyaSekmesiHazir = false;
function sekme(ad, sessiz){
  aktifSekme = ad;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === ad));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hidden', s.id !== ad));
  if (ad === 'dosyalar' && !dosyaSekmesiHazir) { dosyaSekmesiHazir = true; renderDosyalar(); }
  if (ad === 'bugun' && D) renderBugun();
  if (!sessiz) window.scrollTo(0, 0);
}
function render(){ renderBugun(); renderProgram(); renderAjanda(); renderDefter(); renderProfil(); etiketleriGuncelle(); }
function etiketleriGuncelle(){
  const s = new Set();
  D.ajanda.forEach(a => a.etiket && s.add(a.etiket));
  D.defter.forEach(n => n.etiket && s.add(n.etiket));
  (dosyalar || []).forEach(f => f.etiket && s.add(f.etiket));
  for (let g = 1; g <= 5; g++) (D.program[g] || []).forEach(v => v && s.add(v));
  $('#etiketler').innerHTML = [...s].sort((a,b) => a.localeCompare(b,'tr')).map(v => `<option value="${esc(v)}">`).join('');
}

/* ================= BUGÜN ================= */
function renderBugun(){
  const now = new Date(), g = now.getDay();
  const haftaSonu = g === 0 || g === 6;
  const pg = haftaSonu ? 1 : g;
  const simdi = now.getHours() * 60 + now.getMinutes();
  const satirlar = D.saatler.map((s, i) => ({saat:s, ders:(D.program[pg] || [])[i] || ''})).filter(x => x.ders.trim());
  const prog = satirlar.length
    ? '<ul class="list">' + satirlar.map(x => {
        const r = aralik(x.saat), aktif = !haftaSonu && r && simdi >= r[0] && simdi < r[1];
        return `<li class="${aktif ? 'now' : ''}"><span class="time">${esc(x.saat)}</span><span class="pill" style="${renkStil(x.ders)}">${esc(x.ders)}</span>${aktif ? '<span class="tag">Şu an</span>' : ''}</li>`;
      }).join('') + '</ul>'
    : `<div class="empty">Bu gün için program boş. <a href="#" data-go="program">Ders programını doldur →</a></div>`;
  const gecmis = D.ajanda.filter(a => !a.bitti && a.tarih && gunFarki(a.tarih) < 0).length;
  const yak = D.ajanda.filter(a => !a.bitti && a.tarih && gunFarki(a.tarih) <= 14).sort(tarihSirala);
  $('#bugun').innerHTML = `
    <div class="muted">${GUNLER[g]}</div>
    <div class="big-date">${esc(now.toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'}))}</div>
    <div class="grid2">
      <div class="card"><h2>${haftaSonu ? 'Hafta sonu 🎉 · Pazartesi dersleri' : 'Bugünkü dersler'}</h2>${prog}</div>
      <div class="card"><h2>Yaklaşanlar (14 gün)${gecmis ? ` · <span class="late">${gecmis} gecikmiş</span>` : ''}</h2>${ajandaListe(yak, true)}</div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Hızlı ekle</h2>${ajandaForm()}</div>`;
}

/* ================= DERS PROGRAMI ================= */
function renderProgram(){
  const bugun = new Date().getDay();
  let h = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Haftalık ders programı</h2>
      <div class="row"><button class="btn small" data-act="saat-ekle">+ Ders saati</button><button class="btn small" data-act="saat-sil">− Son saati sil</button></div>
    </div><div class="scroll"><table class="prog"><thead><tr><th class="tcol">Saat</th>`;
  for (let g = 1; g <= 5; g++) h += `<th class="${g === bugun ? 'today' : ''}">${GUNLER[g]}</th>`;
  h += '</tr></thead><tbody>';
  D.saatler.forEach((s, i) => {
    h += `<tr><td class="tcol"><input data-saat="${i}" value="${esc(s)}" aria-label="${i+1}. ders saati"></td>`;
    for (let g = 1; g <= 5; g++) {
      const v = (D.program[g] || [])[i] || '';
      h += `<td class="${g === bugun ? 'today' : ''}" style="${v ? renkStil(v) : ''}"><input data-cell="${g}-${i}" list="etiketler" value="${esc(v)}" placeholder="—"></td>`;
    }
    h += '</tr>';
  });
  h += `</tbody></table></div><p class="muted" style="font-size:13px;margin:10px 0 0">Hücreye ders ya da sınıf adını yaz (ör. "Matematik" veya "9-A İngilizce"). Aynı isimler aynı renkte görünür. Saatleri de değiştirebilirsin. Her şey otomatik kaydedilir.</p></div>`;
  $('#program').innerHTML = h;
}

/* ================= AJANDA ================= */
let ajFiltre = 'aktif', ajAra = '', ajEdit = null;
function ajandaForm(a){
  a = a || {};
  return `<form data-ajanda-form data-id="${esc(a.id || '')}" class="row">
    <select name="tur">${Object.entries(TURLER).map(([k,v]) => `<option value="${k}" ${a.tur === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <input name="baslik" placeholder="Başlık (ör. Fizik yazılısı)" required value="${esc(a.baslik || '')}" style="flex:2;min-width:180px">
    <input name="etiket" list="etiketler" placeholder="Ders / sınıf / etiket" value="${esc(a.etiket || '')}" style="flex:1;min-width:130px">
    <input name="tarih" type="date" value="${esc(a.tarih || '')}">
    <input name="aciklama" placeholder="Not (isteğe bağlı)" value="${esc(a.aciklama || '')}" style="flex:2;min-width:160px">
    <button class="btn primary">${a.id ? 'Güncelle' : 'Ekle'}</button>
    ${a.id ? '<button type="button" class="btn" data-act="iptal">Vazgeç</button>' : ''}
  </form>`;
}
function ajandaListe(items, kisa){
  if (!items.length) return '<div class="empty">Kayıt yok.</div>';
  return '<ul class="list">' + items.map(a => {
    const f = a.tarih ? gunFarki(a.tarih) : null, gec = !a.bitti && f !== null && f < 0;
    return `<li class="${a.bitti ? 'done' : ''}">
      <input type="checkbox" data-toggle="${a.id}" ${a.bitti ? 'checked' : ''} title="Tamamlandı">
      <div style="flex:1;min-width:0"><div class="title">${esc(a.baslik)}</div>
        <div class="meta"><span class="tag t-${esc(a.tur)}">${TURLER[a.tur] || 'Diğer'}</span>
        ${a.etiket ? `<span class="tag gray">${esc(a.etiket)}</span>` : ''}
        ${a.tarih ? `<span class="${gec ? 'late' : 'muted'}">${esc(tarihYazi(a.tarih))} · ${kalanYazi(f)}</span>` : ''}
        ${a.aciklama ? `<span class="muted">· ${esc(a.aciklama)}</span>` : ''}</div></div>
      ${kisa ? '' : `<button class="btn small" data-edit="${a.id}">Düzenle</button><button class="btn small danger" data-del="${a.id}">Sil</button>`}
    </li>`;
  }).join('') + '</ul>';
}
function renderAjanda(){
  const edit = ajEdit ? D.ajanda.find(a => a.id === ajEdit) : null;
  const etiket = {aktif:'Yapılacaklar', tamam:'Tamamlananlar', tum:'Tümü'};
  $('#ajanda').innerHTML = `
    <div class="card"><h2>${edit ? 'Kaydı düzenle' : 'Yeni kayıt'}</h2>${ajandaForm(edit)}</div>
    <div class="card"><div class="row" style="margin-bottom:6px">
      ${Object.keys(etiket).map(k => `<button class="btn small ${ajFiltre === k ? 'on' : ''}" data-filtre="${k}">${etiket[k]}</button>`).join('')}
      <input id="aj-ara" type="search" placeholder="Ara…" value="${esc(ajAra)}" style="flex:1;min-width:140px">
    </div><div id="aj-liste"></div></div>`;
  renderAjandaListe();
}
function renderAjandaListe(){
  let items = D.ajanda.slice();
  if (ajFiltre === 'aktif') items = items.filter(a => !a.bitti);
  if (ajFiltre === 'tamam') items = items.filter(a => a.bitti);
  if (ajAra) { const q = lower(ajAra); items = items.filter(a => lower(a.baslik + ' ' + (a.etiket || '') + ' ' + (a.aciklama || '')).includes(q)); }
  items.sort(tarihSirala);
  if (ajFiltre === 'tamam') items.reverse();
  $('#aj-liste').innerHTML = ajandaListe(items, false);
}

/* ================= DEFTER ================= */
let notSecili = null, notAra = '';
function renderDefter(){
  $('#defter').innerHTML = `<div class="defter">
    <div class="card"><div class="row" style="margin-bottom:6px">
      <input id="not-ara" type="search" placeholder="Notlarda ara…" value="${esc(notAra)}" style="flex:1">
      <button class="btn primary small" data-act="not-yeni">+ Yeni not</button></div>
      <div id="not-liste"></div></div>
    <div class="card" id="not-editor"></div></div>`;
  renderNotListe(); renderNotEditor();
}
function renderNotListe(){
  let n = D.defter.slice().sort((a,b) => (b.guncel || '').localeCompare(a.guncel || ''));
  if (notAra) { const q = lower(notAra); n = n.filter(x => lower(x.baslik + ' ' + x.etiket + ' ' + x.icerik).includes(q)); }
  $('#not-liste').innerHTML = n.length
    ? '<ul class="list">' + n.map(x => `<li class="nitem ${x.id === notSecili ? 'sel' : ''}" data-note="${x.id}">
        <div style="min-width:0;flex:1"><div class="title">${esc(x.baslik || 'Başlıksız not')}</div>
        <div class="meta">${x.etiket ? `<span class="tag gray">${esc(x.etiket)}</span>` : ''}<span class="muted">${esc(new Date(x.guncel).toLocaleDateString('tr-TR'))}</span></div></div></li>`).join('') + '</ul>'
    : '<div class="empty">Henüz not yok.</div>';
}
function renderNotEditor(){
  const x = D.defter.find(n => n.id === notSecili), el = $('#not-editor');
  if (!x) { el.innerHTML = '<div class="empty">Bir not seç ya da yeni not oluştur.</div>'; return; }
  el.innerHTML = `<div class="row" style="margin-bottom:8px">
      <input id="not-baslik" placeholder="Başlık" value="${esc(x.baslik)}" style="flex:2;min-width:160px;font-weight:600">
      <input id="not-etiket" list="etiketler" placeholder="Etiket" value="${esc(x.etiket || '')}" style="flex:1;min-width:110px">
      <button class="btn small danger" data-act="not-sil">Sil</button></div>
    <textarea id="not-icerik" rows="18" placeholder="Notunu buraya yaz… (otomatik kaydedilir)">${esc(x.icerik)}</textarea>`;
}

/* ================= DOSYALAR ================= */
let dosyalar = null, dosyaAra = '';
function renderDosyalar(){
  $('#dosyalar').innerHTML = `
    <div class="card"><h2>Dosya yükle</h2>
      <form id="up-form" class="row">
        <input type="file" name="dosya" multiple required style="flex:2;min-width:200px">
        <input name="etiket" list="etiketler" placeholder="Etiket (ör. 10-B, Kulüp)" style="flex:1;min-width:140px">
        <button class="btn primary">Yükle</button>
      </form>
      <div id="up-status" class="muted" style="margin-top:8px;font-size:13px">Dosyalar Google Drive'ındaki "Okul Paneli / Dosyalar" klasörüne kaydedilir. Dosya başına en fazla 25 MB.</div>
    </div>
    <div class="card"><div class="row" style="margin-bottom:6px">
      <input id="dosya-ara" type="search" placeholder="Dosya ya da etiket ara…" value="${esc(dosyaAra)}" style="flex:1">
      <button class="btn small" data-act="dosya-yenile">Yenile</button></div>
      <div id="dosya-liste"><div class="empty">Yükleniyor…</div></div></div>`;
  if (dosyalar) renderDosyaListe(); else dosyaGetir();
}
async function dosyaGetir(){
  try { dosyalar = await call('listFiles'); renderDosyaListe(); etiketleriGuncelle(); }
  catch (e) { $('#dosya-liste').innerHTML = `<div class="empty late">Dosyalar alınamadı: ${esc(e.message || e)}</div>`; }
}
function renderDosyaListe(){
  let f = dosyalar || [];
  if (dosyaAra) { const q = lower(dosyaAra); f = f.filter(x => lower(x.name + ' ' + x.etiket).includes(q)); }
  $('#dosya-liste').innerHTML = f.length
    ? '<ul class="list">' + f.map(x => `<li>
        <span style="font-size:22px">${ikon(x.mime)}</span>
        <div style="flex:1;min-width:0"><button class="fname" data-dac="${x.id}">${esc(x.name)}</button>
          <div class="meta">${x.etiket ? `<span class="tag gray">${esc(x.etiket)}</span>` : ''}<span class="muted">${boyut(x.size)} · ${esc(new Date(x.date).toLocaleDateString('tr-TR'))}</span></div></div>
        <button class="btn small" data-dac="${x.id}">Aç / İndir</button>
        <button class="btn small danger" data-dsil="${x.id}">Sil</button></li>`).join('') + '</ul>'
    : '<div class="empty">Dosya yok.</div>';
}
async function dosyaAc(id){
  const w = window.open('', '_blank'); // açılır pencere engeline takılmamak için hemen aç
  if (w) w.document.write('<p style="font-family:system-ui;padding:24px">Dosya açılıyor…</p>');
  try {
    const f = await call('getFile', id);
    const bin = atob(f.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: f.mime}));
    const m = f.mime || '';
    const onizleme = m.includes('pdf') ? `<iframe src="${url}" style="width:100%;height:calc(100vh - 70px);border:0"></iframe>`
      : m.startsWith('image') ? `<img src="${url}" style="max-width:100%;display:block;margin:auto">`
      : m.startsWith('video') ? `<video src="${url}" controls style="max-width:100%;display:block;margin:auto"></video>`
      : m.startsWith('audio') ? `<audio src="${url}" controls></audio>`
      : m.startsWith('text') ? `<iframe src="${url}" style="width:100%;height:calc(100vh - 70px);border:0"></iframe>`
      : '<p>Bu dosya türü tarayıcıda önizlenemiyor. İndirip aç.</p>';
    const html = `<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(f.name)}</title>
      <body style="margin:0;font-family:system-ui,sans-serif"><div style="display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #ddd">
      <b style="flex:1;overflow-wrap:anywhere">${esc(f.name)}</b><a href="${url}" download="${esc(f.name)}" style="background:#2f6fdf;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none">İndir</a></div>
      <div style="padding:12px">${onizleme}</div></body>`;
    if (w) { w.document.open(); w.document.write(html); w.document.close(); }
    else { const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
  } catch (e) {
    if (w) w.close();
    alert('Dosya açılamadı: ' + (e.message || e));
  }
}
function base64Oku(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
async function dosyaYukle(form){
  const files = [...form.dosya.files], etiket = form.etiket.value.trim(), st = $('#up-status');
  const btn = form.querySelector('button'); btn.disabled = true;
  let hata = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 25 * 1048576) { alert(`"${f.name}" 25 MB sınırını aşıyor, atlandı.`); hata++; continue; }
    st.textContent = `Yükleniyor (${i+1}/${files.length}): ${f.name}…`;
    try { dosyalar = await call('uploadFile', f.name, f.type, await base64Oku(f), etiket); renderDosyaListe(); }
    catch (e) { hata++; alert(`"${f.name}" yüklenemedi: ${e.message || e}`); }
  }
  btn.disabled = false; form.reset(); etiketleriGuncelle();
  st.textContent = hata ? `Bitti, ${hata} dosya yüklenemedi.` : 'Yükleme tamamlandı ✓';
}

/* ================= Olaylar ================= */
document.addEventListener('click', async e => {
  if (e.target.closest('#user-btn')) { $('#user-menu').classList.toggle('hidden'); return; }
  if (!e.target.closest('#user-menu')) menuKapat(); else if (e.target.closest('button')) menuKapat();
  const t = e.target.closest('[data-tab],[data-go],[data-act],[data-edit],[data-del],[data-filtre],[data-note],[data-dsil],[data-dac]');
  if (!t || !D) return;
  const ds = t.dataset;
  if (ds.tab) return sekme(ds.tab);
  if (ds.dac) return dosyaAc(ds.dac);
  if (ds.act === 'profil') { renderProfil(); return sekme('profil'); }
  if (ds.act === 'cikis') {
    if (dirty || saving) { alert('Değişiklikler kaydediliyor, birkaç saniye sonra tekrar dene.'); return; }
    return girisGoster();
  }
  if (ds.go) { e.preventDefault(); return sekme(ds.go); }
  if (ds.filtre) { ajFiltre = ds.filtre; return renderAjanda(); }
  if (ds.edit) { ajEdit = ds.edit; renderAjanda(); return sekme('ajanda'); }
  if (ds.del) {
    if (!confirm('Bu kayıt silinsin mi?')) return;
    D.ajanda = D.ajanda.filter(a => a.id !== ds.del);
    if (ajEdit === ds.del) ajEdit = null;
    change(); return render();
  }
  if (ds.note) {
    notSecili = ds.note; renderNotListe(); renderNotEditor();
    if (innerWidth < 760) $('#not-editor').scrollIntoView({behavior:'smooth'});
    return;
  }
  if (ds.dsil) {
    if (!confirm('Dosya silinsin mi? (Drive çöp kutusuna gider)')) return;
    t.disabled = true;
    try { dosyalar = await call('deleteFile', ds.dsil); renderDosyaListe(); }
    catch (err) { alert('Silinemedi: ' + (err.message || err)); t.disabled = false; }
    return;
  }
  switch (ds.act) {
    case 'saat-ekle': {
      const son = aralik(D.saatler[D.saatler.length - 1]);
      const f = n => String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
      D.saatler.push(son ? f(son[1] + 10) + '-' + f(son[1] + 50) : '');
      change(); return renderProgram();
    }
    case 'saat-sil': {
      if (D.saatler.length <= 1) return;
      const i = D.saatler.length - 1;
      const dolu = [1,2,3,4,5].some(g => (D.program[g] || [])[i]);
      if (dolu && !confirm('Son satırda ders var. Yine de silinsin mi?')) return;
      D.saatler.pop(); for (let g = 1; g <= 5; g++) D.program[g].splice(i, 1);
      change(); return renderProgram();
    }
    case 'iptal': ajEdit = null; return renderAjanda();
    case 'not-yeni': {
      const n = {id:uid(), baslik:'', etiket:'', icerik:'', guncel:new Date().toISOString()};
      D.defter.push(n); notSecili = n.id; notAra = ''; change(); renderDefter();
      return $('#not-baslik').focus();
    }
    case 'not-sil': {
      if (!confirm('Bu not silinsin mi?')) return;
      D.defter = D.defter.filter(n => n.id !== notSecili); notSecili = null;
      change(); return renderDefter();
    }
    case 'dosya-yenile': $('#dosya-liste').innerHTML = '<div class="empty">Yükleniyor…</div>'; return dosyaGetir();
  }
});

document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.toggle;
  if (!id) return;
  const a = D.ajanda.find(x => x.id === id); if (!a) return;
  a.bitti = e.target.checked; change(); render();
});

document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.cell) {
    const [g, i] = ds.cell.split('-').map(Number);
    D.program[g][i] = t.value;
    for (let k = 0; k < i; k++) if (D.program[g][k] == null) D.program[g][k] = '';
    t.parentElement.style.cssText = t.value.trim() ? renkStil(t.value) : '';
    return change();
  }
  if (ds.saat !== undefined) { D.saatler[+ds.saat] = t.value; return change(); }
  if (t.id === 'aj-ara') { ajAra = t.value; return renderAjandaListe(); }
  if (t.id === 'not-ara') { notAra = t.value; return renderNotListe(); }
  if (t.id === 'dosya-ara') { dosyaAra = t.value; return renderDosyaListe(); }
  if (t.id.startsWith('not-')) {
    const n = D.defter.find(x => x.id === notSecili); if (!n) return;
    n[t.id.slice(4)] = t.value; n.guncel = new Date().toISOString();
    change(); return renderNotListe();
  }
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.id === 'giris-form') {
    e.preventDefault();
    const btn = form.querySelector('button'); btn.disabled = true; $('#giris-hata').textContent = '';
    try { await girisYap(form.sifre.value, form.hatirla.checked); }
    catch (err) { SIFRE = null; $('#giris-hata').textContent = String(err && err.message || err); form.sifre.select(); }
    finally { btn.disabled = false; }
    return;
  }
  if (form.id === 'profil-form') {
    e.preventDefault();
    ['ad', 'unvan', 'okul', 'eposta'].forEach(k => D.profil[k] = form[k].value.trim());
    change(); renderKullanici();
    $('#profil-durum').textContent = 'Kaydedildi ✓';
    return;
  }
  if (form.id === 'sifre-form') {
    e.preventDefault();
    const st = $('#sifre-durum'), v = Object.fromEntries(new FormData(form));
    if (v.yeni !== v.yeni2) { st.textContent = 'Yeni şifreler aynı değil.'; return; }
    if (v.eski !== SIFRE) { st.textContent = 'Mevcut şifre yanlış.'; return; }
    try {
      st.textContent = 'Değiştiriliyor…';
      await call('sifreDegistir', v.yeni);
      const kalici = (() => { try { return !!localStorage.getItem('op_sifre'); } catch (er) { return false; } })();
      SIFRE = v.yeni; depo.sil(); depo.koy(v.yeni, kalici);
      form.reset(); st.textContent = 'Şifre değiştirildi ✓ Diğer cihazlarda yeni şifreyle giriş yapman gerekecek.';
    } catch (err) { st.textContent = 'Değiştirilemedi: ' + (err.message || err); }
    return;
  }
  if (form.id === 'up-form') { e.preventDefault(); return dosyaYukle(form); }
  if (!form.hasAttribute('data-ajanda-form')) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(form));
  const kayit = {tur:v.tur, baslik:v.baslik.trim(), etiket:v.etiket.trim(), tarih:v.tarih, aciklama:v.aciklama.trim()};
  if (!kayit.baslik) return;
  const id = form.dataset.id;
  if (id) Object.assign(D.ajanda.find(a => a.id === id) || {}, kayit);
  else D.ajanda.push(Object.assign({id:uid(), bitti:false}, kayit));
  ajEdit = null; change(); render();
});

setInterval(() => { if (D && aktifSekme === 'bugun' && !document.hidden && !$('#bugun').contains(document.activeElement)) renderBugun(); }, 60000);
document.body.classList.add('logged-out');
basla();
</script>
